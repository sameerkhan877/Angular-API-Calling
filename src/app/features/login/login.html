<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <!-- Tailwind CDN for easy testing -->
  <script src="https://tailwindcss.com"></script>
</head>
<body class="h-full font-sans antialiased text-slate-800 flex flex-col justify-center py-12 sm:px-6 lg:px-8">

  <!-- Container Box -->
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <!-- Application Brand Logo -->
    <div class="text-center text-3xl font-extrabold tracking-tight text-slate-900 cursor-pointer">
      My<span class="text-blue-600">App</span>
    </div>
    <h2 class="mt-6 text-center text-2xl font-bold tracking-tight text-slate-900">
      Sign in to your account
    </h2>
    <p class="mt-2 text-center text-sm text-slate-500">
      Or
      <a href="#" class="font-medium text-blue-600 hover:text-blue-500 transition-colors">
        create a new account for free
      </a>
    </p>
  </div>

  <!-- Main Card Form Content -->
  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 border border-slate-100 shadow-md rounded-2xl sm:px-10">
      
      <!-- Bind form elements directly to your Angular Component properties -->
      <form class="space-y-6" #loginForm="">
        
        <!-- Email Input Group -->
        <div>
          <label for="email" class="block text-sm font-semibold text-slate-700">
            Email address
          </label>
          <div class="mt-1">
            <input 
              id="email" 
              name="email" 
              type="email" 
              autocomplete="email" 
              required
              class="block w-full rounded-xl border border-slate-200 bg-slate-50/50 px-4 py-3 text-slate-900 shadow-xs placeholder-slate-400 focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:outline-none transition-all text-sm">
          </div>
        </div>

        <!-- Password Input Group -->
        <div>
          <label for="password" class="block text-sm font-semibold text-slate-700">
            Password
          </label>
          <div class="mt-1">
            <input 
              id="password" 
              name="password" 
              type="password" 
              autocomplete="current-password" 
              required
              class="block w-full rounded-xl border border-slate-200 bg-slate-50/50 px-4 py-3 text-slate-900 shadow-xs placeholder-slate-400 focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:outline-none transition-all text-sm">
          </div>
        </div>

        <!-- Remember Me & Forgot Password Layout Line -->
        <div class="flex items-center justify-between">
          <div class="flex items-center">
            <input 
              id="remember-me" 
              name="remember-me" 
              type="checkbox"
              class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
            <label for="remember-me" class="ml-2 block text-sm text-slate-600 cursor-pointer select-none">
              Remember me
            </label>
          </div>

          <div class="text-sm">
            <a href="#" class="font-medium text-blue-600 hover:text-blue-500 transition-colors">
              Forgot password?
            </a>
          </div>
        </div>

        <!-- Submit CTA Button -->
        <div>
          <button 
            type="submit"
            class="flex w-full justify-center rounded-xl bg-blue-600 px-4 py-3 text-sm font-semibold text-white shadow-xs hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all duration-200 ease-in-out cursor-pointer active:scale-95">
            Sign in
          </button>
        </div>
      </form>

      <!-- Minimal Divider Line (Optional: for Social logins later) -->
      <div class="mt-6">
        <div class="relative">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-slate-200/80"></div>
          </div>
          <div class="relative flex justify-center text-xs font-medium uppercase">
            <span class="bg-white px-3 text-slate-400">Secure Environment</span>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
