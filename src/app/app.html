<!-- Main Application Wrapper -->
<div class="min-h-screen bg-slate-50 text-slate-800 flex flex-col">

  <!-- Main Navigation Header Bar -->
  <nav class="sticky top-0 z-50 backdrop-blur-md bg-white/80 border-b border-slate-100 shadow-xs">
    <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
      
      <!-- Brand Logo -->
      <div class="text-xl font-bold tracking-tight text-slate-900 cursor-pointer" routerLink="/">
        My<span class="text-blue-600">App</span>
      </div>
      
      <!-- Navigation Action Links -->
      <div class="flex items-center space-x-1 sm:space-x-2 text-sm font-medium">
        
        <a routerLink="/" 
           routerLinkActive="bg-blue-50 text-blue-600 font-semibold" 
           [routerLinkActiveOptions]="{exact: true}"
           class="px-4 py-2 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-all duration-150">
           Home
        </a>

        <a routerLink="cars" 
           routerLinkActive="bg-blue-50 text-blue-600 font-semibold"
           class="px-4 py-2 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-all duration-150">
           Cars
        </a>

        <a routerLink="login" 
           routerLinkActive="bg-blue-600 text-white font-semibold shadow-xs hover:bg-blue-700"
           class="px-4 py-2 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-all duration-150">
           Login
        </a>

      </div>
    </div>
  </nav>

  <!-- Page Route Loading Outlet Structure -->
  <!-- Using a minimal wrapper container to add balanced whitespace padding around sub-components -->
  <main class="flex-1 w-full">
    <router-outlet></router-outlet>
  </main>

</div>
